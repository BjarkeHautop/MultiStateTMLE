url: https://github.com/BjarkeHautop/MultiStateTMLE
template:
  bootstrap: 5
  math-rendering: katex

reference:
- title: Package overview
  desc: >
    Overview of the MultiStateTMLE package.
  contents:
  - MultiStateTMLE-package

- title: Initial fit
  desc: >
    Fitting the initial (nuisance) hazard models and building the discrete
    product state space used internally.
  contents:
  - fit_initial

- title: Targeted estimation
  desc: >
    Targeting the initial fit under a stochastic intensity intervention.
  contents:
  - tmle_alpha
  - estimate_derivative

- title: Calibration
  desc: >
    Calibrating an intensity intervention to a target effect size, and
    decomposing treatment effects into calibrated contrasts.
  contents:
  - calibrate_alpha
  - calibration_curve
  - solve_alpha
  - calibrated_contrasts

- title: Data
  desc: >
    Example data.
  contents:
  - illness_death

- title: Deprecated
  desc: >
    Functions superseded by the snake_case functions above. Will be removed in
    the future.
  contents:
  - prepare.initial
  - tmle.alpha.fun
  - calibration.fun
  - calibration.curve.fun
  - estimate.alpha.fun
  - estimate.derivative
  - make.calibrated.contrasts
  - compute.Q.clever.per.id
