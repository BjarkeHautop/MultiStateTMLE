url: https://github.com/BjarkeHautop/MultiStateTMLE
template:
  bootstrap: 5
  math-rendering: katex

reference:
- title: Package overview
  desc: >
    Overview of the MultiStateTMLE package.
  contents:
  - MultiStateTMLE-package

- title: Initial fit
  desc: >
    Fitting the initial (nuisance) hazard models and building the discrete
    product state space used internally.
  contents:
  - fit_initial
  - hazard_model
  - as_sim_model

- title: Targeted estimation
  desc: >
    Estimating a target parameter under a stochastic intensity intervention,
    fixed or calibrated.
  contents:
  - tmle_estimate
  - target-parameters
  - interventions

- title: Calibration
  desc: >
    Tracing the intervention curve, and decomposing treatment effects into
    calibrated contrasts.
  contents:
  - intervention_curve
  - calibrated_contrasts

- title: Results
  desc: >
    Printing, extracting estimates from, and computing confidence intervals
    for the result objects.
  contents:
  - result-methods

- title: Data
  desc: >
    Example data.
  contents:
  - illness_death
